openapi: 3.0.3
info:
  title: Edge Redirector API
  version: 1.0.0
paths:
  /r/{slug}:
    get:
      summary: Resolve smart link and redirect
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '302':
          description: Redirect
          headers:
            X-Rule-Id:
              description: Matched rule id
              schema:
                type: string
        '404':
          description: Not found
        '204':
          description: No content


